services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    environment:
      DB_HOST: db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      RAILS_ENV: development
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3042,http://127.0.0.1:3042}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:3042}
      ALLOW_PASSWORD_RESET_PREVIEW: ${ALLOW_PASSWORD_RESET_PREVIEW:-1}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ABACATEPAY_API_KEY: ${ABACATEPAY_API_KEY:-}
      ABACATEPAY_CHECKOUT_URL: ${ABACATEPAY_CHECKOUT_URL:-}
    ports:
      - "${API_PORT:-3041}:3041"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3041/up"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?defina NEXT_PUBLIC_API_URL no .env}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "${WEB_PORT:-3042}:3042"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
